name: CD Pipeline


on:
  push:
    branches: [master]
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 推荐 LTS 版本
          registry-url: https://registry.npmjs.org/
          cache: 'npm' # 缓存依赖，加速构建
      - name: Upgrade npm to latest (解决 OIDC 兼容问题)
        run: npm install -g npm@latest
      - run: npm install
      - run: npm run build
      - run: npm run test
      - run: npm publish --access public
